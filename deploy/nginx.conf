# /etc/nginx/snippets/qd209.conf
# Include this in the ttport.vn server block (HTTPS 443)
# Usage: include /etc/nginx/snippets/qd209.conf;

# QD209 Application — Reverse proxy to Node.js
# Case-insensitive: /QD209, /qd209, /Qd209, /qD209 all work
location ~* ^/qd209(/.*)?$ {
    # $is_args$args: khi proxy_pass có biến, nginx không tự nối query string
    # (nếu thiếu, ?limit=… và ?force=… sẽ bị mất).
    proxy_pass http://127.0.0.1:3000$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
